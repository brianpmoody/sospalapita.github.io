<!DOCTYPE html>
<html>
<head>
  <title>Panel de Emergencias</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body style="margin:0; font-family:sans-serif; background:#111; color:white; text-align:center;">

<h1 style="padding:20px;">🚨 PANEL DE EMERGENCIAS LA PALAPITA 🚨</h1>

<div style="display:grid; grid-template-columns:1fr 1fr; gap:15px; padding:15px;">

<button onclick="mostrarSucursales('ROBO')" style="background:#c62828; font-size:24px; padding:40px; color:white; border:none; border-radius:10px;">
🔴 ROBO
</button>

<button onclick="mostrarSucursales('INCENDIO')" style="background:#ef6c00; font-size:24px; padding:40px; border:none; border-radius:10px;">
🔥 INCENDIO
</button>

<button onclick="mostrarSucursales('INTRUSIÓN')" style="background:#1565c0; font-size:24px; padding:40px; color:white; border:none; border-radius:10px;">
🚨 INTRUSIÓN
</button>

<button onclick="mostrarSucursales('ATAQUE ARMADO')" style="background:#6a1b9a; font-size:24px; padding:40px; color:white; border:none; border-radius:10px;">
🔫 ATAQUE ARMADO
</button>

</div>

<!-- Modal -->
<div id="modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9);">

<h2 style="margin-top:40px;">Selecciona sucursal</h2>

<button onclick="confirmar()" style="display:none;"></button>

<div style="margin-top:30px;">

<button onclick="enviarAlerta('SUC-01 (Arco Norte)')" style="font-size:22px; padding:20px; margin:10px; width:80%; border-radius:10px;">
🏢 SUC-01 (Arco Norte)
</button>

<button onclick="enviarAlerta('SUC-02 (Kabah)')" style="font-size:22px; padding:20px; margin:10px; width:80%; border-radius:10px;">
🏢 SUC-02 (Kabah)
</button>

<button onclick="enviarAlerta('SUC-03 (Zona Hotelera)')" style="font-size:22px; padding:20px; margin:10px; width:80%; border-radius:10px;">
🏢 SUC-03 (Zona Hotelera)
</button>

<button onclick="enviarAlerta('SUC-04 (Rancho Viejo)')" style="font-size:22px; padding:20px; margin:10px; width:80%; border-radius:10px;">
🏢 SUC-04 (Rancho Viejo)
</button>

<button onclick="enviarAlerta('SUC-05 (Luna)')" style="font-size:22px; padding:20px; margin:10px; width:80%; border-radius:10px;">
🏢 SUC-05 (Luna)
</button>

<button onclick="enviarAlerta('SUC-06 (Tulum)')" style="font-size:22px; padding:20px; margin:10px; width:80%; border-radius:10px;">
🏢 SUC-06 (Tulum)
</button>

<button onclick="enviarAlerta('SUC-07 (Malecon)')" style="font-size:22px; padding:20px; margin:10px; width:80%; border-radius:10px;">
🏢 SUC-06 (Malecon)
</button>


</div>

<br><br>

<button onclick="cerrarModal()" style="padding:10px 20px; font-size:18px;">
Cancelar
</button>

</div>

<script>

let tipoAlerta = "";

function mostrarSucursales(tipo) {
  tipoAlerta = tipo;
  document.getElementById("modal").style.display = "block";
}

function cerrarModal() {
  document.getElementById("modal").style.display = "none";
}

function enviarAlerta(sucursal) {

  let confirmacion = confirm(`¿Confirmar ${tipoAlerta} en ${sucursal}?`);

  if (!confirmacion) return;

  let mensaje = `🚨 ALERTA: ${tipoAlerta}
📍 SUCURSAL: ${sucursal}
🕒 HORA: ${new Date().toLocaleTimeString()}
Estado: ACTIVA`;

  let token = "8580667020:AAECAADDT_mMjLJom6USNbiB3cTplXhWkSQ";
  let chat_id = "-5217790991";

  fetch(`https://api.telegram.org/bot${token}/sendMessage`, {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({
      chat_id: chat_id,
      text: mensaje
    })
  });

  alert("✅ Alerta enviada");

  cerrarModal();
}

</script>

</body>
</html>
